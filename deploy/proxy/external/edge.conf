# Section 21.7: the `external` profile publishes one upstream on
# 127.0.0.1:${RR_EXTERNAL_HTTP_PORT}, so the owner's proxy sees a single
# address instead of having to route between `api` and `web` itself.
#
# Deliberately minimal: no TLS, no rate limits, no security headers. Those are
# the external proxy's job, and duplicating them here would mean two places to
# change and two chances to disagree.

user  nginx;
worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 2048; }

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;
    sendfile on; tcp_nopush on; tcp_nodelay on;
    keepalive_timeout 65s;
    client_max_body_size 10m;
    # Section 19.6: the path only (`$uri`), never the query string — the
    # default `combined` format's `$request` carries `/auth/tg?token=<jwt>`,
    # and so does the `Referer` of the page that link opens — and never the
    # webhook's `secret_path`.
    map $uri $rr_log_uri { ~^/tg/webhook/ /tg/webhook/***; default $uri; }
    map $http_referer $rr_log_referer { ~^(?<rr_referer_path>[^?]*) $rr_referer_path; default ''; }
    log_format rr_json escape=json
      '{"time":"$time_iso8601","remote_addr":"$remote_addr","request_id":"$request_id",'
      '"method":"$request_method","uri":"$rr_log_uri","status":$status,"bytes_sent":$bytes_sent,'
      '"request_time":$request_time,"upstream":"$upstream_addr","upstream_time":"$upstream_response_time",'
      '"host":"$host","user_agent":"$http_user_agent","referer":"$rr_log_referer"}';
    access_log /dev/stdout rr_json;

    upstream rr_web { server web:3001; keepalive 32; }
    upstream rr_api { server api:3000; keepalive 32; }

    map $http_upgrade $connection_upgrade { default upgrade; '' close; }

    server {
        listen 8080 default_server;
        server_name _;

        location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }

        proxy_http_version 1.1;
        # The external proxy's values are passed through untouched; the API
        # decides what to believe from `RR_TRUSTED_PROXIES`.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header X-Forwarded-Port  $server_port;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_connect_timeout 5s; proxy_send_timeout 30s; proxy_read_timeout 60s;
        proxy_redirect off;

        # The bot's and the worker's API (section 9.5) is reached on the compose
        # network, never through the owner's proxy; so are the metrics
        # (section 19.7), which Prometheus scrapes from `api:3000`. The API
        # checks only its socket's address, which here is the edge's own.
        location ^~ /api/internal/ { return 404; }
        location ^~ /metrics { return 404; }
        location ^~ /api/     { proxy_pass http://rr_api; }
        location ^~ /webhooks/ { proxy_pass http://rr_api; }
        location ^~ /tg/      { proxy_pass http://rr_api; }
        location /            { proxy_pass http://rr_web; }
    }
}
