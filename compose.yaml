name: remnaray

# Section 23.1: the monitoring profile is part of the deployment but starts
# nothing unless `--profile monitoring` asks for it.
include:
  - path: deploy/monitoring/compose.monitoring.yaml

x-app-common: &app-common
  image: ${RR_APP_IMAGE:-${RR_REGISTRY:-ghcr.io/remnaray}/app:${RR_VERSION:-1}}
  env_file: .env
  environment: &app-environment
    TZ: UTC
    RR_THEMES_DIR: /themes
    RR_LOCALES_DIR: /locales
    RR_API_URL: http://api:3000
    # Built by the application from the `POSTGRES_*` of `.env`, which percent-
    # encodes the password; a URL assembled here would break on `@`, `/` or
    # `#` in it. An explicit DATABASE_URL still wins.
    DATABASE_URL: ${DATABASE_URL:-}
    VALKEY_URL: ${VALKEY_URL:-redis://valkey:6379/0}
  networks: [rr_net]
  restart: unless-stopped
  volumes:
    - ./themes:/themes:ro
    - ./locales:/locales:ro
    - uploads:/uploads
  read_only: true
  tmpfs: [/tmp]
  security_opt: [no-new-privileges:true]
  logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-remnaray}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-remnaray}
    # PostgreSQL 18 moved its data into a version-specific directory and
    # declares the volume one level up; a mount at the old `/data` path makes
    # the entrypoint refuse to start rather than write where nothing reads.
    volumes: [pgdata:/var/lib/postgresql]
    networks: [rr_net]
    # Over TCP: on an empty volume the image first initialises with a server on
    # the unix socket only, which answers ready and then restarts (L-35).
    healthcheck:
      test:
        [
          CMD-SHELL,
          'pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-remnaray} -d ${POSTGRES_DB:-remnaray}',
        ]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }

  valkey:
    image: valkey/valkey:9.1-alpine
    command:
      [
        valkey-server,
        --save,
        '60',
        '1000',
        --appendonly,
        yes,
        --maxmemory,
        256mb,
        --maxmemory-policy,
        noeviction,
      ]
    volumes: [valkeydata:/data]
    networks: [rr_net]
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }

  # Section 21.1: applies the migrations before anything else starts, and
  # section 20.4 makes it dump first when a pending migration cannot be undone.
  migrate:
    <<: *app-common
    working_dir: /app/dist/packages/db
    command: [node, /app/dist/tools/migrate.js]
    restart: 'no'
    read_only: false
    volumes:
      - ./themes:/themes:ro
      - ./locales:/locales:ro
      - uploads:/uploads:ro
      - ./backups:/backups
    depends_on:
      postgres: { condition: service_healthy }

  api:
    <<: *app-common
    command: [node, dist/apps/api/main.js]
    expose: ['3000']
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3000/api/v1/health/ready]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  bot:
    <<: *app-common
    command: [node, dist/apps/bot/main.js]
    expose: ['3002']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3002/health]
      interval: 15s
      timeout: 5s
      retries: 4

  worker:
    <<: *app-common
    command: [node, dist/apps/worker/main.js]
    expose: ['3003']
    # `maintenance.backup-check` reads `.last-status`, which the `backup`
    # service writes there, and `maintenance.disk-check` asks the filesystem
    # of the database volume for its free space (section 20.3); the database
    # files stay the `postgres` user's and unreadable here. A merge key does
    # not merge lists, so the common mounts are repeated.
    volumes:
      - ./themes:/themes:ro
      - ./locales:/locales:ro
      - uploads:/uploads
      - ./backups:/backups:ro
      - pgdata:/pgdata:ro
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3003/health]
      interval: 15s
      timeout: 5s
      retries: 4

  web:
    image: ${RR_WEB_IMAGE:-${RR_REGISTRY:-ghcr.io/remnaray}/web:${RR_VERSION:-1}}
    environment:
      INTERNAL_API_URL: http://api:3000
      RR_THEMES_DIR: /themes
      RR_LOCALES_DIR: /locales
      RR_DOMAIN: ${RR_DOMAIN}
      TZ: UTC
      PORT: 3001
    networks: [rr_net]
    expose: ['3001']
    depends_on: { api: { condition: service_healthy } }
    healthcheck:
      test: [CMD, wget, -qO-, http://127.0.0.1:3001/api/healthz]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s
    read_only: true
    tmpfs: [/tmp, /app/apps/web/.next/cache]
    volumes:
      - ./themes:/themes:ro
      - ./locales:/locales:ro
      - uploads:/uploads:ro
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }

  # --- proxy (section 21.1). `external` starts none of these. ---
  proxy-config:
    <<: *app-common
    command:
      [
        node,
        dist/tools/render-proxy.js,
        --profile,
        '${RR_PROXY_PROFILE:-nginx}',
        --tls,
        '${RR_TLS_MODE:-acme}',
        --watch,
      ]
    read_only: false
    volumes:
      - proxy-conf:/proxy-conf
      - ./deploy/proxy:/templates:ro
      - certbot-state:/run/remnaray/certbot:ro
    depends_on:
      # The renderer's first act is to read `settings`, so it waits for the
      # migrations like every other reader does. Without this it crash-loops
      # until they land, and `proxy-nginx` starts behind a container that is
      # "started" only in the sense that it has not given up yet.
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      valkey: { condition: service_healthy }
    healthcheck:
      test: [CMD, test, -f, /tmp/proxy-config-ready]
      interval: 5s
      timeout: 3s
      retries: 12
    profiles: [nginx, caddy]

  proxy-nginx:
    image: ${RR_NGINX_IMAGE:-${RR_REGISTRY:-ghcr.io/remnaray}/nginx:${RR_VERSION:-1}}
    # IPv4 only (R13, owner decision О-1): the compose network has no IPv6, so
    # Docker would forward the host's IPv6 addresses from the network gateway,
    # an address the proxy trusts for X-Forwarded-For.
    ports: ['0.0.0.0:80:80', '0.0.0.0:443:443', '0.0.0.0:443:443/udp']
    volumes:
      - proxy-conf:/etc/nginx/conf.d:ro
      - proxy-acme:/var/cache/nginx/acme
      - proxy-cache:/var/cache/nginx/proxy
      - certbot-webroot:/var/www/certbot:ro
      - certbot-certs:/etc/letsencrypt:ro
      - ./deploy/proxy/certs:/etc/nginx/certs:ro
    networks: { rr_net: { ipv4_address: 172.28.0.10 } }
    depends_on:
      proxy-config: { condition: service_healthy }
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }
    profiles: [nginx]

  # Section 21.7: the single upstream an owner's own proxy talks to.
  edge:
    image: nginx:1.30-alpine
    command: [nginx, -c, /etc/nginx/conf.d/edge.conf, -g, 'daemon off;']
    ports: ['127.0.0.1:${RR_EXTERNAL_HTTP_PORT:-8080}:8080']
    volumes:
      - ./deploy/proxy/external:/etc/nginx/conf.d:ro
    networks: [rr_net]
    depends_on:
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1:8080/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    read_only: true
    tmpfs: [/tmp, /var/cache/nginx]
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }
    profiles: [external]

  # Only with RR_TLS_MODE=certbot; `./rr up` adds the profile automatically.
  certbot:
    image: certbot/certbot:latest
    environment:
      RR_DOMAIN: ${RR_DOMAIN}
    entrypoint: [/bin/sh, /scripts/certbot.sh]
    volumes:
      - certbot-webroot:/var/www/certbot
      - certbot-certs:/etc/letsencrypt
      - certbot-state:/run/remnaray/certbot
      - ./deploy/proxy/certbot.sh:/scripts/certbot.sh:ro
    networks: [rr_net]
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }
    profiles: [certbot]

  proxy-caddy:
    image: ${RR_CADDY_IMAGE:-${RR_REGISTRY:-ghcr.io/remnaray}/caddy:${RR_VERSION:-1}}
    # IPv4 only (R13, owner decision О-1): the compose network has no IPv6, so
    # Docker would forward the host's IPv6 addresses from the network gateway,
    # an address the proxy trusts for X-Forwarded-For.
    ports: ['0.0.0.0:80:80', '0.0.0.0:443:443', '0.0.0.0:443:443/udp']
    volumes:
      - proxy-conf:/etc/caddy:ro
      - caddy-data:/data
      - caddy-config:/config
      # Not inside /etc/caddy: that path is the read-only `proxy-conf` volume.
      - ./deploy/proxy/certs:/certs:ro
    networks: { rr_net: { ipv4_address: 172.28.0.10 } }
    depends_on:
      proxy-config: { condition: service_healthy }
      web: { condition: service_healthy }
      api: { condition: service_healthy }
    healthcheck:
      test: [CMD, wget, -qO-, 'http://127.0.0.1/healthz']
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }
    profiles: [caddy]

  # The only container with the docker socket, and it is read-only.
  proxy-reloader:
    <<: *app-common
    command: [node, dist/tools/proxy-reloader.js, --profile, '${RR_PROXY_PROFILE:-nginx}']
    environment:
      <<: *app-environment
      RR_PROXY_CONTAINER: ${COMPOSE_PROJECT_NAME:-remnaray}-proxy-${RR_PROXY_PROFILE:-nginx}-1
    healthcheck:
      test: [CMD, test, -f, /tmp/proxy-reloader-ready]
      interval: 2s
      timeout: 3s
      retries: 30
    # The socket is owned by root and by a group whose id differs from host to
    # host, so an unprivileged user cannot be given access portably — and a
    # container that may drive the Docker API is already as privileged as the
    # host. `no-new-privileges` and the read-only socket still apply.
    user: '0:0'
    read_only: false
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - proxy-conf:/proxy-conf:ro
      - certbot-state:/run/remnaray/certbot:ro
    depends_on:
      valkey: { condition: service_healthy }
    profiles: [nginx, caddy]

  # Section 20.5: the daily dump, its retention and the optional S3 copy.
  backup:
    image: ${RR_BACKUP_IMAGE:-${RR_REGISTRY:-ghcr.io/remnaray}/backup:${RR_VERSION:-1}}
    env_file: .env
    environment:
      TZ: UTC
      POSTGRES_HOST: postgres
    volumes:
      - ./backups:/backups
      - ./deploy/backup:/scripts:ro
      - ./themes:/src/themes:ro
      - uploads:/src/uploads:ro
    networks: [rr_net]
    depends_on:
      postgres: { condition: service_healthy }
    restart: unless-stopped
    security_opt: [no-new-privileges:true]
    logging: { driver: json-file, options: { max-size: '50m', max-file: '5' } }
    profiles: [nginx, caddy, external]

networks:
  rr_net:
    # The subnet is fixed because `set_real_ip_from` and `RR_TRUSTED_PROXIES`
    # name it (section 21.1). `ip_range` keeps automatic addresses away from
    # 172.28.0.10, which the proxy reserves: without it Docker hands that
    # address to whichever service it creates tenth and the proxy cannot start.
    ipam: { config: [{ subnet: 172.28.0.0/16, ip_range: 172.28.1.0/24 }] }

volumes:
  pgdata: {}
  valkeydata: {}
  uploads: {}
  proxy-conf: {}
  proxy-acme: {}
  proxy-cache: {}
  certbot-webroot: {}
  certbot-certs: {}
  certbot-state: {}
  caddy-data: {}
  caddy-config: {}
