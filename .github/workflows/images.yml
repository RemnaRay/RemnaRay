# Building the images needs more machine than the smallest server has: a
# 1 vCPU / 2 GB box spends a quarter of an hour on the Next.js build alone, and
# may not finish it. This publishes the same images a release would, under a
# tag of the owner's choosing and without making a release, so a deployment
# pulls in a minute instead of building for twenty.
#
# `RR_REGISTRY=ghcr.io/<owner>` and `RR_VERSION=<tag>` in `.env` point a
# deployment at what this publishes.
name: images

on:
  workflow_dispatch:
    inputs:
      tag:
        description: The tag to publish under (for example dev, or a commit sha).
        required: false
        default: dev
      platforms:
        description: Platforms to build for.
        required: false
        default: linux/amd64
        type: choice
        options:
          - linux/amd64
          - linux/amd64,linux/arm64

# Every job asks for what it uses; the workflow grants no more than reading
# the repository (R116).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/docker/app.Dockerfile
          - image: web
            file: deploy/docker/web.Dockerfile
          - image: nginx
            file: deploy/proxy/nginx/Dockerfile
          - image: caddy
            file: deploy/proxy/caddy/Dockerfile
          - image: backup
            file: deploy/backup/Dockerfile
    steps:
      # The tag is typed by hand and goes into `tags:`, a comma-separated
      # list. `1`, `1.2`, `1.2.3`, `1.2.3-rc.1`, `1.2.3-<date>` and `rc` are
      # what releases and rebuilds publish, signed and scanned; this unsigned
      # build must not replace what `RR_VERSION=1` pulls.
      - name: Check the tag
        env:
          TAG: ${{ inputs.tag }}
        run: |
          if ! printf '%s\n' "$TAG" | grep -Eqx '[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}'; then
            echo "Not a Docker tag: $TAG" >&2
            exit 1
          fi
          if [ "$TAG" = rc ] || printf '%s\n' "$TAG" | grep -Eqx '[0-9]+(\.[0-9]+){0,2}|[0-9]+\.[0-9]+\.[0-9]+-.*'; then
            echo "$TAG is a release tag; publish under another name (dev, a commit sha)" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Name the registry namespace
        id: ns
        run: |
          printf 'owner=%s\n' "$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        if: contains(inputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # No SBOM, no attestation and no floating tags: those belong to a
      # release. This is one named build an owner asked for.
      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          platforms: ${{ inputs.platforms }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}:${{ inputs.tag }}
          cache-from: type=gha,scope=images-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=images-${{ matrix.image }}

  summary:
    name: how to pull them
    runs-on: ubuntu-latest
    needs: images
    steps:
      - name: Write the two lines the server needs
        env:
          TAG: ${{ inputs.tag }}
        run: |
          owner=$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          {
            printf 'Add to `.env` on the server:\n\n'
            printf '```\nRR_REGISTRY=ghcr.io/%s\nRR_VERSION=%s\n```\n\n' "$owner" "$TAG"
            printf 'Then `./scripts/rr up`. '
            printf 'A private package needs `docker login ghcr.io` with a token that has `read:packages`.\n'
          } >> "$GITHUB_STEP_SUMMARY"
