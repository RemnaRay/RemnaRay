# Section 24.6. The application does not change; its base images do. Every
# Monday the five images are rebuilt on whatever `node:24-alpine`,
# `nginx:1.30-alpine`, `caddy:2-alpine` and `postgres:18-alpine` currently are,
# published as `X.Y.Z-<yyyymmdd>`, and the floating `X.Y` and `X` tags are
# moved onto them when the version is the newest of their line.
# The changelog does not change: nothing about the application did.
name: rebuild

on:
  schedule:
    - cron: '0 4 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: The released version to rebuild (for example 1.2.3).
        required: false

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  rebuild:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/docker/app.Dockerfile
          - image: web
            file: deploy/docker/web.Dockerfile
          - image: nginx
            file: deploy/proxy/nginx/Dockerfile
          - image: caddy
            file: deploy/proxy/caddy/Dockerfile
          # `compose.yaml` pulls this one in every profile, so a rebuild that
          # leaves it behind leaves it on an ageing base.
          - image: backup
            file: deploy/backup/Dockerfile
    steps:
      # The highest published final version, not GitHub's "latest release":
      # that is the one published last, and a patch to the previous minor
      # (24.5) would keep the current line from being rebuilt (R114).
      - name: Find the latest release
        id: release
        uses: actions/github-script@v7
        with:
          script: |
            const asked = context.payload.inputs?.version;
            if (asked) return asked;
            const releases = await github.paginate(github.rest.repos.listReleases, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              per_page: 100,
            });
            const versions = releases
              .filter((release) => !release.draft && !release.prerelease)
              .map((release) => /^v(\d+)\.(\d+)\.(\d+)$/u.exec(release.tag_name))
              .filter(Boolean)
              .map((match) => match.slice(1, 4).map(Number));
            if (versions.length === 0) throw new Error('No published final release');
            versions.sort((a, b) => a[0] - b[0] || a[1] - b[1] || a[2] - b[2]);
            return versions.at(-1).join('.');
          result-encoding: string

      # Typed by hand or read from the latest release, it becomes a checkout
      # ref, a shell argument and image tags: only a release's own form.
      - name: Check the version
        env:
          VERSION: ${{ steps.release.outputs.result }}
        run: |
          number='(0|[1-9][0-9]*)'
          if ! printf '%s\n' "$VERSION" \
            | grep -Eqx "${number}\.${number}\.${number}(-rc\.${number})?"; then
            echo "Not a released version (X.Y.Z or X.Y.Z-rc.N): $VERSION" >&2
            exit 1
          fi

      # Decided on the default branch, which carries the script and every
      # release tag: a manual rebuild of an older version must not move
      # `X.Y` or `X` back onto it.
      - name: Checkout the default branch
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Decide the floating tags
        id: floating
        run: scripts/floating-tags.sh '${{ steps.release.outputs.result }}' >> "$GITHUB_OUTPUT"

      - name: Checkout that release
        uses: actions/checkout@v7
        with:
          ref: v${{ steps.release.outputs.result }}

      - name: Name the registry namespace
        id: ns
        run: |
          printf 'owner=%s\n' "$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, under no tag: a rebuild whose scan fails leaves nothing
      # behind that a deployment could pull by name (R115).
      - name: Build it again, from scratch
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: RR_APP_VERSION=${{ steps.release.outputs.result }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          pull: true
          no-cache: true
          sbom: true
          provenance: mode=max

      - name: Scan the rebuilt image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Section 24.4 p. 3: a `cosign` signature, keyless, bound to this
      # workflow's GitHub identity and recorded in the Sigstore transparency
      # log. By digest, once the scan is clean; the tags below must name it.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image with cosign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/rebuild\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # Only once the scan is clean: a rebuild that made things worse must not
      # become what `RR_VERSION=1` resolves to.
      - name: Publish the dated and floating tags
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          VERSION: ${{ steps.release.outputs.result }}
          MOVE_MINOR: ${{ steps.floating.outputs.minor }}
          MOVE_MAJOR: ${{ steps.floating.outputs.major }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          tags="${VERSION}-$(date -u '+%Y%m%d')"
          if [ "$MOVE_MINOR" = true ]; then tags="$tags ${VERSION%.*}"; fi
          if [ "$MOVE_MAJOR" = true ]; then tags="$tags ${VERSION%%.*}"; fi
          source="${IMAGE}@${DIGEST}"
          for tag in $tags; do
            docker buildx imagetools create --tag "${IMAGE}:${tag}" "$source"
            # The signature covers one digest; a tag naming another would
            # be published unsigned.
            published=$(docker buildx imagetools inspect "${IMAGE}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')
            if [ "$published" != "$DIGEST" ]; then
              echo "${IMAGE}:${tag} is ${published}, not the signed ${DIGEST}" >&2
              exit 1
            fi
          done

      - name: Attest the provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
