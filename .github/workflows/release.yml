# Section 24.4. A tag `vX.Y.Z` publishes the five images, each with an SBOM, a
# cosign signature and a provenance attestation, and opens a GitHub Release
# with the changelog. A pre-release
# `vX.Y.Z-rc.N` publishes under `rc` and never moves the floating major tag,
# so an owner following `RR_VERSION=1` is not upgraded onto a candidate.
name: release

# Only the two forms 24.4 names; `v*` also let `v1.2`, `v1.2.3-beta` and
# `v1.2.3+build` through, to half-publish or to publish under `rc`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/docker/app.Dockerfile
          - image: web
            file: deploy/docker/web.Dockerfile
          - image: nginx
            file: deploy/proxy/nginx/Dockerfile
          - image: caddy
            file: deploy/proxy/caddy/Dockerfile
          # `compose.yaml` pulls this one in every profile, so a release that
          # leaves it behind is a release nobody can start.
          - image: backup
            file: deploy/backup/Dockerfile
    outputs:
      prerelease: ${{ steps.version.outputs.prerelease }}
      latest: ${{ steps.floating.outputs.latest }}
    steps:
      # All history, for the release tags `floating-tags.sh` compares with.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The filter above is a glob; this is the exact rule, and the version
      # that later steps put in a shell and in image tags is checked here.
      - name: Read the tag
        id: version
        run: |
          number='(0|[1-9][0-9]*)'
          if ! printf '%s\n' "$GITHUB_REF_NAME" \
            | grep -Eqx "v${number}\.${number}\.${number}(-rc\.${number})?"; then
            echo "Not a release tag (vX.Y.Z or vX.Y.Z-rc.N): $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-rc.*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Decide the floating tags
        id: floating
        run: scripts/floating-tags.sh '${{ steps.version.outputs.version }}' >> "$GITHUB_OUTPUT"

      - name: Name the registry namespace
        id: ns
        run: |
          printf 'owner=%s\n' "$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # `X.Y.Z` always; `X.Y` and `X` only for a final release that is the
      # newest of its line, so neither a candidate nor a patch to an older
      # minor becomes what `RR_VERSION=1` resolves to.
      - name: Work out the tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}},enable=${{ steps.floating.outputs.minor == 'true' }}
            type=semver,pattern={{major}},enable=${{ steps.floating.outputs.major == 'true' }}
            type=raw,value=rc,enable=${{ steps.version.outputs.prerelease == 'true' }}

      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: RR_APP_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

      # Section 24.4 p. 3: a `cosign` signature, keyless, bound to this
      # workflow's GitHub identity and recorded in the Sigstore transparency
      # log. By digest, which every tag of this image points at.
      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign the image with cosign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # A build provenance attestation besides the signature (`gh attestation
      # verify`); it is not the cosign signature section 24.4 asks for.
      - name: Attest the provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: images
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with: { fetch-depth: 0 }

      - name: Take this version's section out of the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## +\\[?" v "\\]?" { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            printf 'No changelog section for %s.\n' "$version" > notes.md
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
          prerelease: ${{ needs.images.outputs.prerelease == 'true' }}
          generate_release_notes: true
          # GitHub makes every new release the latest by default, so a patch
          # to the previous minor would take that place from the current line.
          make_latest: ${{ needs.images.outputs.latest }}
