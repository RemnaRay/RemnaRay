# Section 24.4. A tag `vX.Y.Z` publishes the five images, each with an SBOM, a
# cosign signature and a provenance attestation, and opens a GitHub Release
# with the changelog. A pre-release
# `vX.Y.Z-rc.N` publishes under `rc` and never moves the floating major tag,
# so an owner following `RR_VERSION=1` is not upgraded onto a candidate.
#
# Every image is pushed by digest, scanned and signed first; the tags are
# published by one job once all five are through (R115), so a failed image
# or scan never leaves `RR_VERSION=1` resolving to a mix of two releases.
name: release

# Only the two forms 24.4 names; `v*` also let `v1.2`, `v1.2.3-beta` and
# `v1.2.3+build` through, to half-publish or to publish under `rc`.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
      - 'v[0-9]+.[0-9]+.[0-9]+-rc.[0-9]+'

# Every job asks for what it uses; the workflow grants no more than reading
# the repository (R116).
permissions:
  contents: read

env:
  REGISTRY: ghcr.io

jobs:
  images:
    name: ${{ matrix.image }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/docker/app.Dockerfile
          - image: web
            file: deploy/docker/web.Dockerfile
          - image: nginx
            file: deploy/proxy/nginx/Dockerfile
          - image: caddy
            file: deploy/proxy/caddy/Dockerfile
          # `compose.yaml` pulls this one in every profile, so a release that
          # leaves it behind is a release nobody can start.
          - image: backup
            file: deploy/backup/Dockerfile
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
      minor: ${{ steps.floating.outputs.minor }}
      major: ${{ steps.floating.outputs.major }}
      latest: ${{ steps.floating.outputs.latest }}
    steps:
      # All history, for the release tags `floating-tags.sh` compares with.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      # The filter above is a glob; this is the exact rule, and the version
      # that later steps put in a shell and in image tags is checked here.
      - name: Read the tag
        id: version
        run: |
          number='(0|[1-9][0-9]*)'
          if ! printf '%s\n' "$GITHUB_REF_NAME" \
            | grep -Eqx "v${number}\.${number}\.${number}(-rc\.${number})?"; then
            echo "Not a release tag (vX.Y.Z or vX.Y.Z-rc.N): $GITHUB_REF_NAME" >&2
            exit 1
          fi
          version="${GITHUB_REF_NAME#v}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in
            *-rc.*) echo 'prerelease=true' >> "$GITHUB_OUTPUT" ;;
            *) echo 'prerelease=false' >> "$GITHUB_OUTPUT" ;;
          esac

      - name: Decide the floating tags
        id: floating
        run: scripts/floating-tags.sh '${{ steps.version.outputs.version }}' >> "$GITHUB_OUTPUT"

      - name: Name the registry namespace
        id: ns
        run: |
          printf 'owner=%s\n' "$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # The labels only: the `tags` job below publishes the tags.
      - name: Work out the labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}

      # By digest, under no tag: nothing is published until the scan below
      # and the other four images are through.
      - name: Build and push by digest
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          build-args: RR_APP_VERSION=${{ steps.version.outputs.version }}
          platforms: linux/amd64,linux/arm64
          outputs: type=image,name=${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }},push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.meta.outputs.labels }}
          sbom: true
          provenance: mode=max
          cache-from: type=gha,scope=release-${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.image }}

      # The gate `rebuild.yml` and `nightly.yml` apply: an image with a fixable
      # critical or high vulnerability is never tagged.
      - name: Scan the image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}@${{ steps.push.outputs.digest }}
          severity: CRITICAL,HIGH
          exit-code: '1'
          ignore-unfixed: true

      # Section 24.4 p. 3: a `cosign` signature, keyless, bound to this
      # workflow's GitHub identity and recorded in the Sigstore transparency
      # log. By digest, which every tag of this image will point at.
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image with cosign
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          cosign sign --yes "${IMAGE}@${DIGEST}"
          cosign verify "${IMAGE}@${DIGEST}" \
            --certificate-identity-regexp '^https://github\.com/${{ github.repository }}/\.github/workflows/release\.yml@' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null

      # A build provenance attestation besides the signature (`gh attestation
      # verify`); it is not the cosign signature section 24.4 asks for.
      - name: Attest the provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.ns.outputs.owner }}/${{ matrix.image }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

      - name: Keep the digest for the tags job
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: |
          mkdir -p digests
          printf '%s' "$DIGEST" > "digests/${{ matrix.image }}"

      - name: Upload the digest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: digest-${{ matrix.image }}
          path: digests/${{ matrix.image }}
          if-no-files-found: error
          retention-days: 1

  # Runs only when every image succeeded. `X.Y.Z` always (`X.Y.Z-rc.N` and
  # `rc` for a candidate); `X.Y` and `X` only for a final release that is the
  # newest of its line, so neither a candidate nor a patch to an older minor
  # becomes what `RR_VERSION=1` resolves to.
  tags:
    name: publish the tags
    runs-on: ubuntu-latest
    needs: images
    permissions:
      packages: write
    steps:
      - name: Name the registry namespace
        id: ns
        run: |
          printf 'owner=%s\n' "$(printf '%s' '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Download the digests
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish the tags
        env:
          OWNER: ${{ steps.ns.outputs.owner }}
          VERSION: ${{ needs.images.outputs.version }}
          PRERELEASE: ${{ needs.images.outputs.prerelease }}
          MOVE_MINOR: ${{ needs.images.outputs.minor }}
          MOVE_MAJOR: ${{ needs.images.outputs.major }}
        run: |
          tags="$VERSION"
          if [ "$PRERELEASE" = true ]; then tags="$tags rc"; fi
          if [ "$MOVE_MINOR" = true ]; then tags="$tags ${VERSION%.*}"; fi
          if [ "$MOVE_MAJOR" = true ]; then tags="$tags ${VERSION%%.*}"; fi
          # All five digests first: a missing one publishes nothing.
          for image in app web nginx caddy backup; do
            test -s "digests/$image"
          done
          for image in app web nginx caddy backup; do
            name="${REGISTRY}/${OWNER}/${image}"
            digest=$(cat "digests/$image")
            for tag in $tags; do
              docker buildx imagetools create --tag "${name}:${tag}" "${name}@${digest}"
              # The signature covers one digest; a tag naming another would
              # be published unsigned.
              published=$(docker buildx imagetools inspect "${name}:${tag}" --format '{{json .Manifest.Digest}}' | tr -d '"')
              if [ "$published" != "$digest" ]; then
                echo "${name}:${tag} is ${published}, not the signed ${digest}" >&2
                exit 1
              fi
            done
          done

  release:
    name: github release
    runs-on: ubuntu-latest
    needs: [images, tags]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with: { fetch-depth: 0 }

      - name: Take this version's section out of the changelog
        id: notes
        run: |
          version="${GITHUB_REF_NAME#v}"
          # Everything between this version's heading and the next one.
          awk -v v="$version" '
            $0 ~ "^## +\\[?" v "\\]?" { printing = 1; next }
            printing && /^## / { exit }
            printing { print }
          ' CHANGELOG.md > notes.md
          if [ ! -s notes.md ]; then
            printf 'No changelog section for %s.\n' "$version" > notes.md
          fi

      - name: Publish the release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          body_path: notes.md
          prerelease: ${{ needs.images.outputs.prerelease == 'true' }}
          generate_release_notes: true
          # GitHub makes every new release the latest by default, so a patch
          # to the previous minor would take that place from the current line.
          make_latest: ${{ needs.images.outputs.latest }}
