# Section 22.6: the checks that are too slow or too noisy for a pull request.
name: nightly

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

# Every job asks for what it uses; the workflow grants no more than reading
# the repository (R116).
permissions:
  contents: read

jobs:
  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit
        run: pnpm audit --audit-level high

  trivy:
    name: trivy / ${{ matrix.image }}
    runs-on: ubuntu-latest
    # The findings go to code scanning.
    permissions:
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: app
            file: deploy/docker/app.Dockerfile
          - image: web
            file: deploy/docker/web.Dockerfile
          - image: nginx
            file: deploy/proxy/nginx/Dockerfile
          - image: caddy
            file: deploy/proxy/caddy/Dockerfile
          # Every profile starts it, and it holds the database password.
          - image: backup
            file: deploy/backup/Dockerfile
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build ${{ matrix.image }}
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: ${{ matrix.file }}
          push: false
          load: true
          tags: remnaray/${{ matrix.image }}:nightly
          cache-from: type=gha,scope=${{ matrix.image }}

      - name: Scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: remnaray/${{ matrix.image }}:nightly
          format: sarif
          output: trivy-${{ matrix.image }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Upload the findings
        uses: github/codeql-action/upload-sarif@1190a975f95ce23525efb6a3fc21ea29567c1b52 # v3
        with:
          sarif_file: trivy-${{ matrix.image }}.sarif
          category: trivy-${{ matrix.image }}

  zap:
    name: zap-baseline
    runs-on: ubuntu-latest
    # The action opens or updates an issue with its report.
    permissions:
      contents: read
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.21.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build the images the stand runs
        run: |
          for image in app web nginx; do
            case "$image" in
              app) file=deploy/docker/app.Dockerfile ;;
              web) file=deploy/docker/web.Dockerfile ;;
              nginx) file=deploy/proxy/nginx/Dockerfile ;;
            esac
            docker buildx build --load -f "$file" -t "remnaray/$image:ci" .
          done
          docker buildx build --load -f deploy/backup/Dockerfile -t remnaray/backup:ci .

      # The smoke stand of section 22.7, left running for ZAP to crawl.
      - name: Start the stand
        run: |
          echo '127.0.0.1 rr.test www.rr.test' | sudo tee -a /etc/hosts
          RR_SMOKE_KEEP=true RR_SMOKE_NO_BROWSER=true deploy/ci/proxy-smoke.sh nginx

      - name: Scan the running stand
        uses: zaproxy/action-baseline@7c4deb10e6261301961c86d65d54a516394f9aed # v0.14.0
        with:
          target: https://rr.test
          cmd_options: '-I -j'
          fail_action: true

      - name: Tear the stand down
        if: always()
        run: |
          docker compose -f compose.yaml -f deploy/ci/compose.smoke.yaml \
            --profile nginx down -v --remove-orphans || true
          rm -f .env
